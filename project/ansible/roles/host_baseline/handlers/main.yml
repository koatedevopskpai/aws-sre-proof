---
- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: restarted

- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: reload audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
  failed_when: false
