# Cilium owns service translation because RKE2 is started with
# disable-kube-proxy: true. Without k8sServiceHost the chart tries the
# ClusterIP 10.43.0.1 before Cilium can program it, and the operator and
# agent crash-loop. The API host must be a real server address during
# bootstrap.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  valuesContent: |-
    kubeProxyReplacement: true
    k8sServiceHost: 10.60.10.11
    k8sServicePort: 6443
    bpf:
      masquerade: true
    operator:
      tolerations:
        - operator: Exists
