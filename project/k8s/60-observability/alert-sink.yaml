# ---------------------------------------------------------------------------
# A minimal webhook receiver standing in for a SIEM/ticketing endpoint.
# Alertmanager and Falcosidekick both post here; every alert is printed as one
# JSON line, which Fluent Bit ships to CloudWatch Logs as platform-alerts.
# GET /alerts returns the retained window for evidence collection.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink
  namespace: siem
data:
  sink.py: |
    import json
    import os
    from collections import deque
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    RETAIN = int(os.environ.get("RETAIN", "50"))
    alerts = deque(maxlen=RETAIN)

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def log_message(self, fmt, *args):
            return

        def _json(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self._json(200, {"status": "ok", "retained": len(alerts)})
            elif self.path == "/alerts":
                self._json(200, {"alerts": list(alerts)})
            else:
                self._json(404, {"error": "not found"})

        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0"))
            raw = self.rfile.read(length).decode("utf-8", "replace")
            try:
                payload = json.loads(raw) if raw else {}
            except json.JSONDecodeError:
                payload = {"raw": raw}
            record = {"received_at_utc": datetime.now(timezone.utc).isoformat(), "source": self.path, "payload": payload}
            alerts.append(record)
            print(json.dumps(record), flush=True)
            self._json(200, {"accepted": True})

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: siem
  labels:
    app.kubernetes.io/name: alert-sink
    app.kubernetes.io/part-of: platform-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
        app.kubernetes.io/part-of: platform-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-sink
          image: python:3.12-slim
          command: ["python3", "/app/sink.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: alert-sink
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: siem
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  selector:
    app.kubernetes.io/name: alert-sink
  ports:
    - {name: http, port: 8080, targetPort: http}
