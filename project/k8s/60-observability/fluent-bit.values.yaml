# Fluent Bit is the node-level collector: container stdout, kube-apiserver
# audit JSON and journald. It writes five CloudWatch Logs streams so retention,
# alerting and SIEM routing can be reasoned about separately.
#
# Authentication is the node instance profile through IMDS. No static AWS
# credential is stored in the cluster.
kind: DaemonSet

hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

image:
  tag: 5.1.3

tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 30m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
  - name: rke2
    hostPath:
      path: /var/lib/rancher/rke2
  - name: journal
    hostPath:
      path: /var/log/journal
  - name: flbstate
    emptyDir: {}

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true
  - name: rke2
    mountPath: /var/lib/rancher/rke2
    readOnly: true
  - name: journal
    mountPath: /var/log/journal
    readOnly: true
  - name: flbstate
    mountPath: /var/state

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        storage.path /var/state
        storage.sync normal
        storage.checksum off
        storage.max_chunks_up 64

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 64MB
        Skip_Long_Lines On
        DB /var/state/containers.db
        DB.locking true

    [INPUT]
        Name tail
        Path /var/lib/rancher/rke2/server/logs/audit.log
        Tag audit.*
        Parser json
        Mem_Buf_Limit 32MB
        Skip_Long_Lines On
        DB /var/state/audit.db
        DB.locking true

    [INPUT]
        Name systemd
        Tag host.*
        Path /var/log/journal
        DB /var/state/journal.db
        Systemd_Filter _SYSTEMD_UNIT=ssh.service
        Systemd_Filter _SYSTEMD_UNIT=auditd.service

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_URL https://kubernetes.default.svc:443
        Kube_CA_File /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Merge_Log_Key log_processed
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name rewrite_tag
        Match kube.*
        Rule $kubernetes['container_name'] ^falco$ falco.events false

    [FILTER]
        Name rewrite_tag
        Match kube.*
        Rule $kubernetes['namespace_name'] ^siem$ alerts.events false

    [FILTER]
        Name modify
        Match kube.*
        Add stream workload

    [FILTER]
        Name modify
        Match audit.*
        Remove requestObject
        Remove responseObject
        Add stream audit

    [FILTER]
        Name modify
        Match falco.events
        Add stream falco

    [FILTER]
        Name modify
        Match alerts.events
        Add stream alerts

    [FILTER]
        Name modify
        Match host.*
        Add stream host

  outputs: |
    [OUTPUT]
        Name cloudwatch_logs
        Match kube.*
        region us-east-1
        log_group_name /platform-lab/workloads
        log_stream_prefix kube-
        auto_create_group false
        workers 2
        retry_limit false

    [OUTPUT]
        Name cloudwatch_logs
        Match audit.*
        region us-east-1
        log_group_name /platform-lab/audit
        log_stream_prefix audit-${HOSTNAME}-
        auto_create_group false
        workers 2
        retry_limit false

    [OUTPUT]
        Name cloudwatch_logs
        Match falco.events
        region us-east-1
        log_group_name /platform-lab/falco
        log_stream_prefix falco-${HOSTNAME}-
        auto_create_group false
        workers 1
        retry_limit false

    [OUTPUT]
        Name cloudwatch_logs
        Match alerts.events
        region us-east-1
        log_group_name /platform-lab/alerts
        log_stream_prefix alerts-${HOSTNAME}-
        auto_create_group false
        workers 1
        retry_limit false

    [OUTPUT]
        Name cloudwatch_logs
        Match host.*
        region us-east-1
        log_group_name /platform-lab/system
        log_stream_prefix host-${HOSTNAME}-
        auto_create_group false
        workers 1
        retry_limit false

