apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-lab-dashboard
  namespace: platform-system
  labels:
    grafana_dashboard: "1"
    grafana_folder: "Platform-lab"
    platform.lab/managed: "true"
data:
  platform-lab-overview.json: |-
    {
      "uid": "platform-lab-overview",
      "title": "Platform lab - cluster and workload",
      "tags": ["platform-lab", "rke2"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Node CPU utilisation",
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"refId": "A", "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}"}
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Node memory available",
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"refId": "A", "expr": "100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes", "legendFormat": "{{instance}}"}
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Probe request rate by status",
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"refId": "A", "expr": "sum by (code) (rate(probe_requests_total[5m]))", "legendFormat": "HTTP {{code}}"}
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Probe mean latency",
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"refId": "A", "expr": "sum(rate(probe_request_duration_seconds_sum[5m])) / clamp_min(sum(rate(probe_request_duration_seconds_count[5m])), 0.001)", "legendFormat": "mean"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Stateful probe volume used",
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"refId": "A", "expr": "100 * kubelet_volume_stats_used_bytes{persistentvolumeclaim=~\"data-probe-stateful-0\"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~\"data-probe-stateful-0\"}", "legendFormat": "{{persistentvolumeclaim}}"}
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "API certificate expires in (days)",
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "d", "decimals": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 30}, {"color": "green", "value": 60}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {"refId": "A", "expr": "(probe_ssl_earliest_cert_expiry{job=\"kubernetes-api\"} - time()) / 86400", "legendFormat": "days"}
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Tenant container restarts (15m)",
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 24},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"refId": "A", "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"tenant-.*\"}[15m]))", "legendFormat": "{{namespace}}/{{pod}}"}
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Root filesystem available",
          "gridPos": {"h": 8, "w": 6, "x": 6, "y": 24},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {"refId": "A", "expr": "100 * node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}", "legendFormat": "{{instance}}"}
          ]
        }
      ]
    }
