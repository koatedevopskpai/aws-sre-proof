apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-budget
  namespace: tenant-probe
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "20"
    services: "5"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: attacker-budget
  namespace: tenant-attacker
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    pods: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: client-budget
  namespace: tenant-client
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    pods: "5"
