apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: tenant-probe
  labels:
    app.kubernetes.io/name: probe
    app.kubernetes.io/part-of: platform-lab
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe
        app.kubernetes.io/part-of: platform-lab
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: probe
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ecr-pull

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: probe
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: probe

      containers:
        - name: probe
          # Digest-pinned: the native CEL admission policy enforces this for tenant workloads.
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/galland-rke2-use1/probe@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROBE_VERSION
              value: "1.0.0"
            - name: ENABLE_FAULTS
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.platform-system.svc.cluster.local:4318"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: tenant-probe
  labels:
    app.kubernetes.io/name: probe
    app.kubernetes.io/part-of: platform-lab
spec:
  selector:
    app.kubernetes.io/name: probe
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: probe
  namespace: tenant-probe
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: probe
---
# ---------------------------------------------------------------------------
# Stateful variant: the subject of the storage and restore exercises.
# One replica is deliberate; this demonstrates the failure mode of a zonal PD
# rather than pretending to be highly available.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: probe-stateful
  namespace: tenant-probe
  labels:
    app.kubernetes.io/name: probe-stateful
    app.kubernetes.io/part-of: platform-lab
spec:
  serviceName: probe-stateful
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: probe-stateful
  template:
    metadata:
      labels:
        app.kubernetes.io/name: probe-stateful
        app.kubernetes.io/part-of: platform-lab
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: probe
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/galland-rke2-use1/probe@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROBE_VERSION
              value: "1.0.0-stateful"
            - name: DB_PATH
              value: /data/probe.db
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.platform-system.svc.cluster.local:4318"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-gp3
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: probe-stateful
  namespace: tenant-probe
  labels:
    app.kubernetes.io/name: probe-stateful
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: probe-stateful
  ports:
    - name: http
      port: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: probe
  namespace: platform-system
  labels:
    platform.lab/managed: "true"
spec:
  namespaceSelector:
    matchNames: [tenant-probe]
  selector:
    matchLabels:
      app.kubernetes.io/name: probe
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s


