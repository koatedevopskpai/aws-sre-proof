apiVersion: v1
kind: Pod
metadata:
  name: forward-test
  namespace: default
spec:
  nodeName: platform-lab-aws-agent-1
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep 600"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
